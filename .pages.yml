media:
  input: zdjecia
  output: /zdjecia

content:
  - name: artykuly
    label: Artykuły
    type: collection
    path: artykuly
    format: yaml-frontmatter
    filename:
      template: '{fields.numer}-{fields.tytul}.md'
      field: create
    view:
      fields: [numer, tytul, data]
      primary: tytul
      sort: [data, tytul]
      default:
        sort: data
        order: desc
    fields:
      - name: numer
        label: Numer artykułu
        type: string
        description: "Wpisz kolejny numer (np. 129, 130...). Sprawdź ostatni numer w liście artykułów."
        required: true
      - name: tytul
        label: Tytuł
        type: string
        required: true
      - name: data
        label: Data i godzina publikacji
        type: date
        description: "Ustaw przyszłą datę i godzinę, aby zaplanować publikację (np. 2026-06-25T18:00). Artykuł pojawi się automatycznie po nadejściu tego terminu."
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
        required: true
      - name: obraz
        label: Okładka (zdjęcie)
        type: image
        required: false
      - name: fb
        label: Link do posta na Facebooku (opcjonalnie)
        type: string
        description: "Wklej tu adres posta z Facebooka, jeśli chcesz, by pod artykułem pojawił się przycisk 'Skomentuj na Facebooku'. Zostaw puste, aby przycisku nie było."
        required: false
      - name: body
        label: Treść artykułu
        type: rich-text
