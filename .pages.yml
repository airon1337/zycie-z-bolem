media:
  input: zdjecia
  output: /zdjecia

content:
  - name: artykuly
    label: Artykuły (PL)
    type: collection
    path: artykuly
    format: yaml-frontmatter
    filename:
      template: '{fields.tytul}.md'
      field: create
    view:
      fields: [tytul, data]
      primary: tytul
      sort: [data, tytul]
      default:
        sort: data
        order: desc
    fields:
      - name: tytul
        label: Tytuł
        type: string
        required: true
      - name: data
        label: Data i godzina publikacji
        type: date
        description: "Ustaw przyszłą datę i godzinę, aby zaplanować publikację (np. 2026-06-25T18:00). Artykuł pojawi się automatycznie po nadejściu tego terminu."
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm
        required: true
      - name: obraz
        label: Okładka (zdjęcie)
        type: image
        required: false
      - name: fb
        label: Link do posta na Facebooku (opcjonalnie)
        type: string
        description: "Wklej tu adres posta z Facebooka, jeśli chcesz, by pod artykułem pojawił się przycisk 'Skomentuj na Facebooku'. Zostaw puste, aby przycisku nie było."
        required: false
      - name: body
        label: Treść artykułu
        type: rich-text

  - name: articles-en
    label: Artykuły (EN)
    type: collection
    path: artykuly-en
    format: yaml-frontmatter
    description: |
      🔄 PROMPT DO TŁUMACZENIA — skopiuj poniższy tekst + treść polskiego artykułu i wklej do AI:

      You are a professional medical translator. Translate this Polish article about trigeminal neuralgia into natural English.

      RULES:
      - Localize, don't translate literally. Adapt for English-speaking patients.
      - Keep the warm, empathetic first-person tone.
      - Keep medical terms accurate in English (trigeminal neuralgia, neuropathic pain, carbamazepine, gabapentin, pregabalin, microvascular decompression, etc.)
      - Do NOT translate drug brand names or Latin medical terms.
      - Preserve all markdown formatting (## headings, **bold**, bullet lists, [links](url)).
      - Generate an English URL slug (short, lowercase, dashes, no Polish characters).
      - Keep the article length similar — do not shorten or summarize.
      - The output should read naturally in English, not like a machine translation.

      FORMAT ODPOWIEDZI — AI ma odpowiedzieć przetłumaczonym artykułem w tym formacie:

      ---
      title: "English title here"
      slug: "short-english-slug-with-dashes"
      date: "YYYY-MM-DDTHH:MM"
      status: published
      ---

      (pełna przetłumaczona treść artykułu w markdown poniżej frontmatter)

      ARTYKUŁ DO PRZETŁUMACZENIA:
      (wklej tutaj polski artykuł)
    filename:
      template: '{fields.title}.md'
      field: create
    view:
      fields: [title, date, status]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Tytuł (po angielsku)
        type: string
        required: true
      - name: date
        label: Data publikacji
        type: date
        options:
          format: yyyy-MM-dd
        required: true
      - name: status
        label: Status
        type: select
        options:
          values: [draft, published]
        default: published
        required: true
      - name: body
        label: Treść artykułu (po angielsku)
        type: rich-text
