name = "myneuralgia-queue-consumer"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[[d1_databases]]
binding = "DB"
database_name = "myneuralgia-cms"
database_id = "REPLACE_WITH_YOUR_DB_ID"

[[queues.consumers]]
queue = "translation-queue"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "translation-dlq"

[vars]
TARGET_REPO = "airon1337/myneuralgia"
TARGET_FOLDER = "content/en"
AI_MODEL = "gpt-4o-mini"
